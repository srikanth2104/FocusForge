<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FocusForge - Tasks</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/tokens.css">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/app.css">
    </head>

    <body>
        <!-- Keyboard users can jump straight past the repeated sidebar -->
        <a class="skip-link" href="#main-content">Skip to main content</a>

        <div class="container">

            <aside class="sidebar">
                <p class="logo">FocusForge</p>
                <nav>
                    <ul>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="tasks.html" class="active" aria-current="page">Tasks</a></li>
                        <li><a href="habits.html">Habits</a></li>
                        <li><a href="stats.html">Stats</a></li>
                    </ul>
                </nav>
            </aside>

            <main id="main-content" class="main-content">
                <header>
                    <div class="header-text">
                        <h1>Task Manager</h1>
                        <p class="page-subtitle">Add, complete, and filter your daily tasks.</p>
                    </div>
                    <button id="darkModeToggle" aria-label="Switch to dark mode">🌙</button>
                </header>

                <div class="task-input">
                    <input type="text" id="taskInput" placeholder="Enter a new task" aria-label="New task" required>
                    <button id="addTaskBtn">Add Task</button>
                </div>

                <div class="tasks-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                </div>

                <ul id="taskList"></ul>
                <p id="emptyMessage">No items yet. Stay productive!</p>
            </main>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
