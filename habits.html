<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FocusForge - Habits</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/tokens.css">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/app.css">
    </head>

    <body>
        <!-- Keyboard users can jump straight past the repeated sidebar -->
        <a class="skip-link" href="#main-content">Skip to main content</a>

        <div class="container">

            <aside class="sidebar">
                <p class="logo">FocusForge</p>
                <nav>
                    <ul>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="tasks.html">Tasks</a></li>
                        <li><a href="habits.html" class="active" aria-current="page">Habits</a></li>
                        <li><a href="stats.html">Stats</a></li>
                    </ul>
                </nav>
            </aside>

            <main id="main-content" class="main-content">
                <header>
                    <div class="header-text">
                        <h1>Habit Tracker</h1>
                        <p class="page-subtitle">Track daily habits and build your streak.</p>
                    </div>
                    <button id="darkModeToggle" aria-label="Switch to dark mode">🌙</button>
                </header>

                <div class="habit-input">
                    <input type="text" id="habitInput" placeholder="Enter a new habit" aria-label="New habit">
                    <button id="addHabitBtn">Add Habit</button>
                </div>

                <ul id="habitList"></ul>

            </main>
        </div>

        <script src="js/app.js"></script>
    </body>

</html>
